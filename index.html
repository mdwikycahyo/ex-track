<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ex-Track">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A boring vibe coded expense tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <title>Ex-Track</title>
  <style>
    :root {
      --bg: #0f1115; --card: #1a1d24; --key: #232733; --key-press: #2e3342; --line: #2a2e38;
      --text: #f2f3f5; --mute: #8b90a0; --accent: #3ddc97; --accent-soft: rgba(61, 220, 151, .18);
      --ink: #06281a; --warn: #ff6b6b; --caution: #f5b74a; --toast-action: #1a7f55;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; text-align: inherit; background: none; border: 0; cursor: pointer; }
    input { font: inherit; color: var(--text); background: var(--key); border: 0; border-radius: 12px; outline: none; user-select: text; -webkit-user-select: text; }
    ul { list-style: none; }
    h1, h2 { font-size: inherit; font-weight: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    .app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: env(safe-area-inset-top) 16px 0; }
    header { padding: 12px 0 6px; }

    .month { display: flex; height: 48px; border-radius: 14px; background: var(--card); overflow: hidden; }
    .month button { flex: 0 0 64px; text-align: center; font-size: 22px; color: var(--mute); }
    .month button:active { background: var(--key); }
    .month button:disabled { opacity: .2; }
    .month h1 { flex: 1; display: grid; place-items: center; font-size: 15px; font-weight: 600; }

    .summary { display: block; width: 100%; margin-top: 16px; }
    .label { font-size: 13px; color: var(--mute); }
    .spent { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .total { font-size: 36px; font-weight: 700; letter-spacing: -.5px; transition: opacity .15s; }
    .pill { border-radius: 12px; background: var(--card); color: var(--accent); font-size: 14px; font-weight: 600; }
    .stats { flex: none; display: grid; place-items: center; width: 44px; height: 44px; }
    .stats svg { width: 20px; height: 20px; fill: currentColor; }

    .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
    header .meter { margin-top: 10px; }
    header .meter i { transition: width .4s var(--ease), background .2s; }
    .gap { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14px; color: var(--mute); }
    .gap b { color: var(--text); font-weight: 600; }
    .gap.over b { color: var(--warn); }
    .gap button { height: 40px; padding: 0 16px; }
    .past .meter, .past .gap, .nobudget .meter, .nobudget #gapText { display: none; }
    .nobudget .gap { justify-content: flex-end; }

    .list { flex: 1; overflow-y: auto; margin: 8px -16px 0; padding-bottom: 12px; }
    .day { padding: 14px 16px 2px; font-size: 12px; color: var(--mute); }
    .item { position: relative; }
    .del { position: absolute; inset: 0; display: none; align-items: center; justify-content: flex-end; padding-right: 20px; background: var(--warn); color: #fff; font-size: 14px; font-weight: 600; }
    .swiping .del { display: flex; }
    .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; background: var(--bg); transition: transform .2s; }
    .row:active { background: var(--card); }
    .row.drag { transition: none; }
    .row.new { animation: pop .35s var(--ease); }
    .icon { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: var(--card); font-size: 18px; }
    .name { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .num, .cat .num { font-weight: 600; }
    .empty { padding: 40px 0; text-align: center; font-size: 14px; color: var(--mute); }

    .amt { padding: 4px 4px 8px; text-align: right; font-size: 40px; font-weight: 700; white-space: nowrap; }
    .amt span { margin-right: 6px; font-size: 20px; color: var(--mute); }
    .amt b { display: inline-block; padding: 0 4px; border-radius: 8px; transition: background .15s; }
    .amt b::after { content: ""; display: inline-block; width: 3px; height: .9em; margin-left: 3px; vertical-align: -.08em; border-radius: 2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
    .amt.bump b { animation: bump .12s; }
    .fresh .amt b { background: var(--accent-soft); }
    .naming .amt b::after { visibility: hidden; }
    .other-name { display: none; width: 100%; margin-bottom: 6px; padding: 11px 14px; font-size: 16px; }
    .other .other-name { display: block; }
    .chips { display: flex; gap: 8px; padding-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 9px 15px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; transition: background .15s, transform .1s; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 600; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pad button { height: 54px; border-radius: 14px; background: var(--key); text-align: center; font-size: 24px; font-weight: 500; transition: transform .08s, background .08s; }
    .pad button:active { background: var(--key-press); }
    .pad .go { grid-column: span 3; background: var(--accent); color: var(--ink); font-size: 18px; font-weight: 700; }
    .pad .go:disabled { opacity: .35; }
    .chip:active, .pad button:active, .pill:active, .summary:active .stats { transform: scale(.96); }

    .entry, .sheet { background: var(--card); border-radius: 22px 22px 0 0; }
    .entry { margin: 0 -16px; padding: 4px 16px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0, 0, 0, .25); }
    .grab { display: block; width: 100%; height: 22px; }
    .grab::before { content: ""; display: block; width: 36px; height: 4px; margin: 8px auto; border-radius: 2px; background: var(--line); }
    .fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s var(--ease); }
    .fold > div { overflow: hidden; }
    .min .fold { grid-template-rows: 0fr; }
    .add { display: none; width: 100%; height: 52px; border-radius: 14px; background: var(--accent); color: var(--ink); text-align: center; font-size: 16px; font-weight: 700; }
    .min .add { display: block; }

    .scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .sheet { position: fixed; inset: auto 0 0; z-index: 11; padding: 4px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .3s var(--ease); }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .sheet.show { transform: none; }
    .sheet h2 { margin: 2px 0 4px; text-align: center; font-size: 15px; font-weight: 600; color: var(--mute); }
    .sheet .amt { padding: 12px 0 16px; text-align: center; font-size: 48px; }
    .delete { width: 100%; height: 48px; margin-top: 8px; text-align: center; color: var(--warn); font-weight: 600; }

    .breakdown { max-height: 80dvh; display: flex; flex-direction: column; }
    .breakdown .total { margin: 4px 0 12px; text-align: center; font-size: 28px; }
    .cats { overflow-y: auto; }
    .cat { display: grid; grid-template-columns: 38px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; }
    .cat .icon { grid-row: span 2; background: var(--key); }
    .cat small { margin-left: 6px; color: var(--mute); font-weight: 400; }
    .cat .meter { grid-column: 2 / 4; }
    .cat .meter i { transform-origin: left; animation: grow .5s var(--ease) both; }

    .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 11px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; white-space: nowrap; transform: translate(-50%, -90px); transition: transform .28s var(--ease); }
    .toast.show { transform: translate(-50%, 0); }
    .toast button { color: var(--toast-action); font-weight: 700; }

    @media (max-height: 760px) {
      header { padding-top: 8px; }
      .month { height: 44px; }
      .summary { margin-top: 10px; }
      .total { font-size: 30px; }
      .entry .amt { padding: 0 4px 4px; font-size: 34px; }
      .sheet .amt { padding: 6px 0 10px; font-size: 38px; }
      .other-name { padding: 9px 14px; }
      .chips { padding-bottom: 8px; }
      .pad { gap: 6px; }
      .pad button { height: 46px; font-size: 22px; }
    }

    @keyframes pop { from { opacity: 0; transform: translateY(-8px); } }
    @keyframes bump { 50% { transform: scale(1.06); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } }
  </style>
</head>
<body>
  <div class="app">
    <header id="header">
      <nav class="month" aria-label="Month">
        <button id="prev" aria-label="Previous month">‹</button>
        <h1 id="month"></h1>
        <button id="next" aria-label="Next month">›</button>
      </nav>
      <button class="summary" id="summary" aria-label="Spending by category">
        <span class="label" id="spentLabel"></span>
        <span class="spent">
          <span class="total num" id="total"></span>
          <span class="stats pill">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="3" rx="1.5"/><rect x="1" y="7" width="9" height="3" rx="1.5"/><rect x="1" y="12" width="5" height="3" rx="1.5"/></svg>
          </span>
        </span>
      </button>
      <div class="meter"><i id="budgetBar"></i></div>
      <div class="gap" id="gap">
        <span class="num" id="gapText"></span>
        <button class="pill" id="editBudget">Edit budget</button>
      </div>
    </header>

    <main class="list" id="list" aria-label="Expenses"></main>

    <section class="entry" id="entry" aria-label="Add expense">
      <button class="grab" id="grab" aria-label="Fold keypad"></button>
      <button class="add" id="add">+ Add expense</button>
      <div class="fold"><div id="logEditor"></div></div>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <span class="grab"></span>
    <h2 id="editTitle"></h2>
    <div id="editEditor"></div>
    <button class="delete" id="delete">Delete expense</button>
  </div>

  <div class="sheet" id="budgetSheet" role="dialog" aria-modal="true" aria-labelledby="budgetTitle">
    <span class="grab"></span>
    <h2 id="budgetTitle">Monthly budget</h2>
    <div id="budgetEditor"></div>
  </div>

  <div class="sheet breakdown" id="breakdownSheet" role="dialog" aria-modal="true" aria-labelledby="breakdownTitle">
    <span class="grab"></span>
    <h2 id="breakdownTitle"></h2>
    <p class="total num" id="breakdownTotal"></p>
    <ul class="cats" id="cats"></ul>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="undo">Undo</button>
  </div>

  <script>
    const CATEGORIES = [["🍜", "Food"], ["☕", "Coffee"], ["🛵", "Transport"], ["🛒", "Groceries"], ["🧾", "Bills"], ["🎉", "Fun"], ["🏷️", "Other"]];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "000", "0", "⌫"];

    const $ = id => document.getElementById(id);
    const fmt = n => n.toLocaleString("id-ID");
    const dayNumber = date => date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
    const today = () => { const now = new Date(); return new Date(now.getFullYear(), now.getMonth(), now.getDate()); };
    const emoji = category => CATEGORIES.find(([, name]) => name === category)[0];
    const title = item => (item.c === "Other" && item.n) || item.c;
    const sum = list => list.reduce((total, item) => total + item.a, 0);
    const vibrate = () => navigator.vibrate?.(8);

    let budget = 0;
    try { budget = +localStorage.budget || 0; } catch {}
    let view = new Date(today().getFullYear(), today().getMonth(), 1);
    let items = [], undoAction = null, newId = null, editId = null;

    const database = new Promise((resolve, reject) => {
      const request = indexedDB.open("ex-track", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("expenses", { keyPath: "id" }).createIndex("d", "d");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    const result = request => new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    const expenses = async mode => (await database).transaction("expenses", mode).objectStore("expenses");
    const toRecord = ({ id, a, c, d, n }) => ({ id, a, c: CATEGORIES.findIndex(([, name]) => name === c), d, ...(n && { n }) });
    const fromRecord = record => ({ ...record, c: CATEGORIES[record.c][1], n: record.n || "" });
    const put = async item => result((await expenses("readwrite")).put(toRecord(item)));
    const drop = async id => result((await expenses("readwrite")).delete(id));

    async function loadMonth() {
      const first = dayNumber(view);
      const records = await result((await expenses("readonly")).index("d").getAll(IDBKeyRange.bound(first, first + 30)));
      items = records.map(fromRecord);
    }

    const isCurrentMonth = () => view.getFullYear() === today().getFullYear() && view.getMonth() === today().getMonth();
    const monthName = () => MONTHS[view.getMonth()];

    function dayLabel(d) {
      const now = today();
      if (d === dayNumber(now)) return "Today";
      if (d === dayNumber(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1))) return "Yesterday";
      return `${d % 100} ${MONTHS[Math.floor(d / 100) % 100 - 1].slice(0, 3)}`;
    }

    function AmountEditor(root, { withCategories = true, action = "Save", onSubmit }) {
      const blank = () => ({ input: "", cat: "Food", name: "", fresh: false, original: null });
      const s = blank();
      const snapshot = () => JSON.stringify([s.input, s.cat, s.cat === "Other" ? s.name.trim() : ""]);

      root.innerHTML =
        (withCategories ? `<input class="other-name" placeholder="What was it? e.g. Parking" maxlength="24" aria-label="Expense name">` : "") +
        `<p class="amt num"><span>Rp</span><b>0</b></p>` +
        (withCategories ? `<div class="chips">${CATEGORIES.map(([e, name]) => `<button class="chip" data-cat="${name}">${e} ${name}</button>`).join("")}</div>` : "") +
        `<div class="pad">${KEYS.map(k => `<button data-key="${k}">${k}</button>`).join("")}<button class="go">${action}</button></div>`;

      const amount = root.querySelector(".amt"), value = amount.querySelector("b");
      const submit = root.querySelector(".go"), nameInput = root.querySelector(".other-name");

      function paint() {
        value.textContent = fmt(+s.input || 0);
        submit.disabled = !+s.input || s.original === snapshot();
        root.classList.toggle("fresh", s.fresh);
        root.classList.toggle("other", s.cat === "Other");
        root.querySelectorAll(".chip").forEach(chip => chip.classList.toggle("on", chip.dataset.cat === s.cat));
        if (nameInput && nameInput.value !== s.name) nameInput.value = s.name;
      }

      function type(key) {
        if (s.fresh && key !== "⌫") s.input = "";
        s.fresh = false;
        if (key === "⌫") s.input = s.input.slice(0, -1);
        else if ((s.input + key).length <= 10 && !(s.input === "" && key.startsWith("0"))) s.input += key;
        amount.classList.remove("bump");
        void amount.offsetWidth;
        amount.classList.add("bump");
      }

      root.querySelector(".pad").addEventListener("click", e => {
        const button = e.target.closest("button");
        if (!button) return;
        vibrate();
        nameInput?.blur();
        if (button === submit) return onSubmit(s);
        type(button.dataset.key);
        paint();
      });

      if (withCategories) {
        root.querySelector(".chips").addEventListener("click", e => {
          const chip = e.target.closest(".chip");
          if (!chip) return;
          vibrate();
          s.cat = chip.dataset.cat;
          paint();
          if (s.cat === "Other") setTimeout(() => nameInput.focus(), 50);
        });
        nameInput.addEventListener("input", () => { s.name = nameInput.value; paint(); });
        nameInput.addEventListener("keydown", e => e.key === "Enter" && nameInput.blur());
        nameInput.addEventListener("focus", () => root.classList.add("naming"));
        nameInput.addEventListener("blur", () => root.classList.remove("naming"));
      }

      paint();
      return {
        reset() { Object.assign(s, blank()); paint(); },
        load(values) { Object.assign(s, values, { fresh: true }); s.original = snapshot(); paint(); }
      };
    }

    const entryFields = s => ({ a: +s.input, c: s.cat, n: s.cat === "Other" ? s.name.trim() : "" });

    const logger = AmountEditor($("logEditor"), {
      onSubmit(s) {
        const d = isCurrentMonth() ? dayNumber(today()) : dayNumber(new Date(view.getFullYear(), view.getMonth() + 1, 0));
        const item = { id: Date.now(), d, ...entryFields(s) };
        items.push(item);
        put(item);
        newId = item.id;
        undoAction = { type: "add", id: item.id };
        logger.reset();
        toast("Saved");
        render();
      }
    });

    const editor = AmountEditor($("editEditor"), {
      action: "Update",
      onSubmit(s) {
        const item = items.find(i => i.id === editId);
        undoAction = { type: "edit", before: { ...item } };
        Object.assign(item, entryFields(s));
        put(item);
        closeSheets();
        toast("Updated");
        render();
      }
    });

    const budgetEditor = AmountEditor($("budgetEditor"), {
      withCategories: false,
      action: "Set budget",
      onSubmit(s) {
        budget = +s.input;
        try { localStorage.budget = budget; } catch {}
        undoAction = null;
        closeSheets();
        toast("Budget set");
        render();
      }
    });

    function render() {
      const current = isCurrentMonth();
      const spent = sum(items);
      const left = budget - spent;
      const pct = budget ? Math.min(100, spent / budget * 100) : 0;
      const bar = $("budgetBar");

      $("month").textContent = `${monthName()} ${view.getFullYear()}`;
      $("next").disabled = current;
      $("header").classList.toggle("past", !current);
      $("header").classList.toggle("nobudget", !budget);
      $("spentLabel").textContent = current ? "Spent this month" : `Spent in ${monthName()}`;
      $("total").textContent = `Rp ${fmt(spent)}`;
      $("editBudget").textContent = budget ? "Edit budget" : "Set budget";
      bar.style.width = `${pct}%`;
      bar.style.background = left < 0 ? "var(--warn)" : pct > 85 ? "var(--caution)" : "";
      $("gap").classList.toggle("over", left < 0);
      $("gapText").innerHTML = `<b>Rp ${fmt(Math.abs(left))}</b> ${left < 0 ? "over" : "left"} of Rp ${fmt(budget)}`;

      const days = {};
      items.sort((a, b) => b.d - a.d || b.id - a.id).forEach(item => (days[item.d] ??= []).push(item));
      $("list").innerHTML = Object.entries(days).sort((a, b) => b[0] - a[0]).map(([d, dayItems]) =>
        `<h2 class="day">${dayLabel(+d)}</h2><ul>${dayItems.map(item =>
          `<li class="item"><span class="del" aria-hidden="true">Delete</span>` +
          `<button class="row${item.id === newId ? " new" : ""}" data-id="${item.id}">` +
          `<span class="icon">${emoji(item.c)}</span><span class="name"></span><span class="num">−${fmt(item.a)}</span>` +
          `</button></li>`).join("")}</ul>`
      ).join("") || `<p class="empty">No expenses in ${monthName()}</p>`;
      $("list").querySelectorAll(".row").forEach(row => row.querySelector(".name").textContent = title(items.find(i => i.id === +row.dataset.id)));
      newId = null;
    }

    function openBreakdown() {
      const spent = sum(items);
      const byCategory = {};
      items.forEach(item => byCategory[item.c] = (byCategory[item.c] || 0) + item.a);
      const rows = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
      const largest = rows[0]?.[1] || 1;

      $("breakdownTitle").textContent = `${monthName()} ${view.getFullYear()} · by category`;
      $("breakdownTotal").textContent = `Rp ${fmt(spent)}`;
      $("cats").innerHTML = rows.map(([category, amount], index) =>
        `<li class="cat"><span class="icon">${emoji(category)}</span><span>${category}</span>` +
        `<span class="num">Rp ${fmt(amount)}<small>${Math.round(amount / spent * 100)}%</small></span>` +
        `<span class="meter"><i style="width:${amount / largest * 100}%;animation-delay:${index * 40}ms"></i></span></li>`
      ).join("") || `<li class="empty">No expenses yet</li>`;
      openSheet("breakdownSheet");
    }

    function openEdit(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      editId = id;
      $("editTitle").textContent = `${emoji(item.c)} ${title(item)} · ${dayLabel(item.d)}`;
      editor.load({ input: String(item.a), cat: item.c, name: item.n });
      openSheet("editSheet");
    }

    function remove(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      items = items.filter(i => i !== item);
      drop(id);
      undoAction = { type: "delete", item };
      vibrate();
      toast("Deleted");
      render();
    }

    function undo() {
      if (!undoAction) return;
      const { type, id, item, before } = undoAction;
      if (type === "add") { items = items.filter(i => i.id !== id); drop(id); }
      if (type === "delete") { items.push(item); put(item); newId = item.id; }
      if (type === "edit") { const target = items.find(i => i.id === before.id); Object.assign(target, before); put(target); }
      undoAction = null;
      $("toast").classList.remove("show");
      render();
    }

    function toast(text) {
      const el = $("toast");
      $("toastText").textContent = text;
      $("undo").hidden = !undoAction;
      el.classList.add("show");
      clearTimeout(el.timer);
      el.timer = setTimeout(() => el.classList.remove("show"), 3500);
    }

    function openSheet(id) {
      $("scrim").classList.add("show");
      $(id).classList.add("show");
    }

    function closeSheets() {
      $("scrim").classList.remove("show");
      document.querySelectorAll(".sheet.show").forEach(sheet => sheet.classList.remove("show"));
      document.activeElement.blur();
    }

    $("undo").addEventListener("click", undo);
    $("scrim").addEventListener("click", closeSheets);
    $("delete").addEventListener("click", () => { closeSheets(); remove(editId); });
    $("summary").addEventListener("click", () => { vibrate(); openBreakdown(); });
    $("editBudget").addEventListener("click", () => {
      vibrate();
      budgetEditor.load({ input: budget ? String(budget) : "" });
      openSheet("budgetSheet");
    });

    function onSwipe(el, { onEnd }) {
      let x0 = 0, y0 = 0;
      el.addEventListener("touchstart", e => ({ clientX: x0, clientY: y0 } = e.touches[0]), { passive: true });
      el.addEventListener("touchend", e => onEnd(e.changedTouches[0].clientX - x0, e.changedTouches[0].clientY - y0, e));
    }

    document.querySelectorAll(".sheet").forEach(sheet => onSwipe(sheet, {
      onEnd: (dx, dy, e) => dy > 70 && !e.target.closest(".pad, .cats") && closeSheets()
    }));

    const list = $("list");
    let swipeRow = null, swipeX = 0, swipeY = 0, swipeDx = 0, swipeAxis = null;
    list.addEventListener("touchstart", e => {
      swipeRow = e.target.closest(".row");
      ({ clientX: swipeX, clientY: swipeY } = e.touches[0]);
      swipeDx = 0;
      swipeAxis = null;
    }, { passive: true });
    list.addEventListener("touchmove", e => {
      if (!swipeRow) return;
      const x = e.touches[0].clientX - swipeX, y = e.touches[0].clientY - swipeY;
      if (!swipeAxis && Math.max(Math.abs(x), Math.abs(y)) > 8) swipeAxis = Math.abs(x) > Math.abs(y) ? "x" : "y";
      if (swipeAxis !== "x") return;
      swipeDx = Math.min(0, x);
      swipeRow.parentNode.classList.add("swiping");
      swipeRow.classList.add("drag");
      swipeRow.style.transform = `translateX(${swipeDx}px)`;
    }, { passive: true });
    list.addEventListener("touchend", () => {
      const row = swipeRow;
      if (!row || swipeAxis !== "x") return;
      row.classList.remove("drag");
      if (swipeDx < -90) {
        row.style.transform = "translateX(-110%)";
        setTimeout(() => remove(+row.dataset.id), 180);
      } else {
        row.style.transform = "";
        setTimeout(() => row.parentNode?.classList.remove("swiping"), 200);
      }
    });
    list.addEventListener("click", e => {
      const row = e.target.closest(".row");
      if (row && swipeAxis !== "x") openEdit(+row.dataset.id);
    });

    const entry = $("entry");
    const expand = () => entry.classList.remove("min");
    function fold() {
      entry.classList.add("min");
      if (entry.contains(document.activeElement)) document.activeElement.blur();
    }

    $("grab").addEventListener("click", () => entry.classList.contains("min") ? expand() : fold());
    $("add").addEventListener("click", () => { vibrate(); expand(); });
    onSwipe(entry, {
      onEnd: (dx, dy, e) => {
        if (e.target.closest(".chips, .other-name")) return;
        if (dy > 50) fold();
        if (dy < -40) expand();
      }
    });
    document.addEventListener("pointerdown", e => {
      if (!entry.contains(e.target) && !e.target.closest(".sheet, .scrim, .toast")) fold();
    });
    let lastScroll = 0;
    list.addEventListener("scroll", () => {
      if (list.scrollTop > lastScroll + 12) fold();
      lastScroll = list.scrollTop;
    }, { passive: true });

    async function shiftMonth(step) {
      const next = new Date(view.getFullYear(), view.getMonth() + step, 1);
      if (next > today()) return;
      view = next;
      vibrate();
      fold();
      $("total").style.opacity = .3;
      await loadMonth();
      render();
      $("total").style.opacity = 1;
    }

    $("prev").addEventListener("click", () => shiftMonth(-1));
    $("next").addEventListener("click", () => shiftMonth(1));
    onSwipe($("header"), { onEnd: dx => Math.abs(dx) > 60 && shiftMonth(dx < 0 ? 1 : -1) });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });

    render();
    loadMonth().then(render);
    navigator.storage?.persist?.();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
